version: v2beta1
name: dapr-food-demo

images:
  order-service:
    image: localhost:5111/dapr-food-demo/order-service
    tags:
      - latest
    context: ./order-service
    dockerfile: ./order-service/Dockerfile

  kitchen-service:
    image: localhost:5111/dapr-food-demo/kitchen-service
    tags:
      - latest
    context: ./kitchen-service
    dockerfile: ./kitchen-service/Dockerfile

  bar-service:
    image: localhost:5111/dapr-food-demo/bar-service
    tags:
      - latest
    context: ./bar-service
    dockerfile: ./bar-service/Dockerfile

deployments:
  dapr-components:
    kubectl:
      manifests:
        - components-k8s/

  services:
    kubectl:
      manifests:
        - k8s/

dev:
  order-service:
    imageSelector: k3d-registry.localhost:5111/dapr-food-demo/order-service
    command: ["python", "app.py"]
    sync:
      - path: ./order-service:/app
        excludePaths:
          - "**/__pycache__"
          - "**/*.pyc"
        onUpload:
          restartContainer: true
    ports:
      - port: "5001"

  kitchen-service:
    imageSelector: k3d-registry.localhost:5111/dapr-food-demo/kitchen-service
    command: ["python", "app.py"]
    sync:
      - path: ./kitchen-service:/app
        excludePaths:
          - "**/__pycache__"
          - "**/*.pyc"
        onUpload:
          restartContainer: true

  bar-service:
    imageSelector: k3d-registry.localhost:5111/dapr-food-demo/bar-service
    command: ["python", "app.py"]
    sync:
      - path: ./bar-service:/app
        excludePaths:
          - "**/__pycache__"
          - "**/*.pyc"
        onUpload:
          restartContainer: true
