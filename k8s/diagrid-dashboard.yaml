apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagrid-dashboard
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diagrid-dashboard
  template:
    metadata:
      labels:
        app: diagrid-dashboard
    spec:
      initContainers:
      - name: init-config
        image: busybox
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dapr-dev-redis
              key: redis-password
        command:
        - sh
        - -c
        - |
          cat > /app/components/state.yaml << EOF
          apiVersion: dapr.io/v1alpha1
          kind: Component
          metadata:
            name: statestore
            namespace: default
          spec:
            type: state.redis
            version: v1
            metadata:
            - name: redisHost
              value: dapr-dev-redis-master.default.svc.cluster.local:6379
            - name: redisPassword
              value: "${REDIS_PASSWORD}"
            - name: keyPrefix
              value: none
            - name: actorStateStore
              value: "true"
          EOF
        volumeMounts:
        - name: state-component
          mountPath: /app/components
      containers:
      - name: diagrid-dashboard
        image: ghcr.io/diagridio/diagrid-dashboard:latest
        imagePullPolicy: Always
        env:
        - name: COMPONENT_FILE
          value: /app/components/state.yaml
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: state-component
          mountPath: /app/components
          readOnly: true
      volumes:
      - name: state-component
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: diagrid-dashboard
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: diagrid-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diagrid-dashboard
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: dapr.devvm-nixos
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: diagrid-dashboard
            port:
              number: 80
